<div>
  <mat-toolbar color="primary" class="main">
    <mat-toolbar-row>
      <button
        mat-icon-button
        (click)="sidenav.toggle()"
        fxShow="true"
        fxHide.gt-sm
      >
        <mat-icon>menu</mat-icon>
      </button>

      <a mat-button routerLink="/home">
        <div class="companyName">
          <img
            src="https://www.zilliondesigns.com/blog/wp-content/uploads/Ecommerce-Logo-17.jpg"
            alt="AVENIDA"
            class="proma-img"
            routerLink="/home"
          />
          <a mat-button class="title">Avinedha</a>
        </div>
      </a>

      <div fxShow="true" fxHide.lt-md class="menu-container">
        <div
          class="menu-item"
          (mouseenter)="showMenOptions = true"
          (mouseleave)="showMenOptions = false"
        >
          <a mat-button routerLink="/home/men">MEN</a>
          <div class="dropdown" *ngIf="showMenOptions">
            <a mat-button routerLink="/home/men/shirts">Shirts</a>
            <a mat-button routerLink="/home/men/pants">T-Shirts</a>
            <a mat-button routerLink="/home/men/pants">Jeans</a>
            <a mat-button routerLink="/home/men/pants">Trousers</a>
          </div>
        </div>

        <div
          class="menu-item"
          (mouseenter)="showWomenOptions = true"
          (mouseleave)="showWomenOptions = false"
        >
          <a mat-button routerLink="/home/women">WOMEN</a>
          <div class="dropdown" *ngIf="showWomenOptions">
            <a mat-button routerLink="/home/women/tops">Tops</a>
            <a mat-button routerLink="/home/women/tops">Leggins</a>
            <a mat-button routerLink="/home/women/tops">Casuals</a>
            <a mat-button routerLink="/home/women/tops">Jeans</a>
          </div>
        </div>

        <div
          class="menu-item"
          (mouseenter)="showKidsOptions = true"
          (mouseleave)="showKidsOptions = false"
        >
          <a mat-button routerLink="/home/kids">KIDS</a>
          <div class="dropdown" *ngIf="showKidsOptions">
            <a mat-button routerLink="/home/kids/toys">Shirts</a>
            <a mat-button routerLink="/home/kids/toys">T-shirts</a>
            <a mat-button routerLink="/home/kids/clothes">Jeans</a>
            <a mat-button routerLink="/home/kids/toys">Night Wear</a>
          </div>
        </div>
      </div>
      <span class="menu-spacer"></span>

      <input
        class="search form-control"
        type="text"
        name="search"
        autocomplete="off"
        placeholder="Search "
      />

      <div class="profile">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-person"
          viewBox="0 0 16 16"
        >
          <path
            d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4Zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10Z"
          />
        </svg>

        <div
          class="profile-menu-item"
          (mouseenter)="showProfileMenu = true"
          (mouseleave)="showProfileMenu = false"
        >
          <button mat-button>
            <span><a mat-button>Profile</a></span>
          </button>
        </div>
      </div>

      <div fxShow="true" fxHide.lt-md class="profile-container">
        <div
          class="profile-menu-item"
          (mouseenter)="showProfileMenu = true"
          (mouseleave)="showProfileMenu = false"
        >
          <div class="profile-dropdown" *ngIf="showProfileMenu">
            <div class="top-c">
              <div class="welcome-text">Welcome</div>

              <div class="access-text">To access your account and orders</div>
              <button
                mat-stroked-button
                color="primary"
                class="login-btn"
                routerLink="/signin"
              >
                Login/Signin
              </button>
            </div>

            <hr class="line" />
            <div class="options-container">
              <a mat-button routerLink="/orders">Orders</a>
            <a mat-button routerLink="/address">Saved Addresses</a>
            <a mat-button routerLink="/home">Contact US</a>
            </div>
            
          </div>
        </div>
      </div>

      <div class="profile">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-heart"
          viewBox="0 0 16 16"
        >
          <path
            d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"
          />
        </svg>
        <a routerLink="/check" mat-button> <span> Wishlist</span> </a>
      </div>
      <div class="profile">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-bag"
          viewBox="0 0 16 16"
        >
          <path
            d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"
          />
        </svg>
        <a routerLink="/cart" mat-button> <span> Bag</span> </a>
      </div>
    </mat-toolbar-row>
  </mat-toolbar>

  <mat-sidenav-container fxFlexFill>
    <mat-sidenav #sidenav class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/home">HOME</a>
        <a mat-list-item routerLink="/home">HOME</a>
        <a mat-list-item routerLink="/home/men">MEN</a>
        <a mat-list-item routerLink="/home/women">WOMEN</a>
        <a mat-list-item routerLink="/home/kids">KIDS</a>
        <a mat-list-item routerLink="/check">Wishlist</a>
        <a mat-list-item routerLink="/cart">Bag</a>
        <a (click)="sidenav.toggle()" mat-list-item>Close</a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content fxFlexFill>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
