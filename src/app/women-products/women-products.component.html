<div style="height: 87vh;background-size: cover;">
    <mat-toolbar color="primary"  class="nav" >
      <mat-toolbar-row>
        <button mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
          <mat-icon>menu</mat-icon>
        </button>
        <img src="https://www.zilliondesigns.com/blog/wp-content/uploads/Ecommerce-Logo-17.jpg" alt="AVENIDA" class="proma-img" routerLink="/home"/>
        <span style="margin-left: 15px; cursor: pointer; margin-top: 25px;font-family: Arial, Helvetica, sans-serif;" routerLink="/home" >AVENIDA </span>
        <span style="margin-left: 100px; cursor: pointer; margin-top: 25px;font-family: Arial, Helvetica, sans-serif;"  routerLink="/home/men" > MEN </span>
        <span style="margin-left: 30px; cursor: pointer; margin-top: 25px;font-family: Arial, Helvetica, sans-serif;"   routerLink="/home/women" >WOMEN</span>
        <span style="margin-left: 30px; cursor: pointer; margin-top: 25px; font-family: Arial, Helvetica, sans-serif;"   routerLink="/home/kids" >KIDS</span>
        <span class="menu-spacer">
          <input class="form-control w-75" type="text" name="search"  autocomplete="off" placeholder="Search " >
        </span>        
        <div fxShow="true" fxHide.lt-md class="tool" >
          <div class="profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16" >
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4Zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10Z"/>
            </svg>
          <button mat-button [matMenuTriggerFor]="menu" > <strong> Profile</strong> </button>
  
          </div>
  
        <mat-menu #menu="matMenu" >
          <div *ngIf="!user">
            <button mat-menu-item routerLink="/signin" >Signup/Login
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z"/>
                <path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
              </svg>
            </button>
          </div>
        <div *ngIf="user">
          <button mat-menu-item routerLink="/user/{{user}}" >My Account
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
            </svg>
          </button>
          <button mat-menu-item routerLink="/logout" >Logout
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
              <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
            </svg>
          </button>
        </div>
        </mat-menu>
  
        <div class="profile">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16">
            <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/>
          </svg>
          <a routerLink="/check" mat-button> <strong> Wishlist</strong> </a> 
        </div>
      
        <div class="profile">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bag" viewBox="0 0 16 16">
          <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/>
        </svg>
          <a routerLink="/cart" mat-button> <strong> Bag</strong> </a>
        </div>
          </div>
            </mat-toolbar-row>
    </mat-toolbar>
  
    <mat-sidenav-container fxFlexFill>
      <mat-sidenav #sidenav >
        <mat-nav-list >
            <a routerLink="/cart" mat-button>BAG</a>
            <a routerLink="/check" mat-button>WISHLIST</a>
          <a (click)="sidenav.toggle()" mat-list-item>Close</a>
        </mat-nav-list>
      </mat-sidenav>
      <mat-sidenav-content fxFlexFill>
   <div class="col-12">
    <h2 class="m-4 text-muted" > Home / <span class="text-dark"> Online Fashion Store / Women</span> </h2>
    <p class="m-4 text-dark">  Online Fashion Store - <span class="text-muted">  {{womenProducts.length}} item</span> </p>
   </div>
   <div class="card-container">
    <div class="card m-4 mt-3 mb-5" *ngFor="let men of womenProducts;trackBy:trackByFn" >
        <figure>
        <section class="slider_container">
            <section class="slider">
                <div class="slide one">
                    <img [src]="men.image1" alt="t-shirt" routerLink="/product/{{men.id}}">
                </div>
                <div class="slide two">
                    <img [src]="men.image2" alt="t-shirt" routerLink="/product/{{men.id}}">
                </div>
                <div class="slide three">
                    <img [src]="men.image3" alt="t-shirt" routerLink="/product/{{men.id}}">
                </div>
                <div class="slide four">
                    <img [src]="men.image4" alt="t-shirt" routerLink="/product/{{men.id}}">
                </div>
            </section>
        </section>
        </figure>
        <section class="details">
           <p class="price"> <strong>  {{men.brandName}}</strong></p>
            <p class="price text-muted"> {{men.name}} </p>
            <p class="price" > <strong>Rs. {{men.offerprice}}  </strong> <span style="text-decoration: line-through;">Rs. {{men.price}} </span> </p>
            <div class="wishlist-container">
                <button  class="btn mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16">
                    <path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/>
              </svg>
                WISHLIST</button>
            </div>
        </section>
      </div>
   </div>
  
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
